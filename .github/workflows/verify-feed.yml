# Verifies the app still works against Metro Transit's real feed.
#
# The test suite runs against a synthetic feed so it needs no network and does
# not break overnight. That leaves one thing untested: whether the *real* feed
# still parses, still sends browser-readable CORS headers, and still plans
# trips. This job covers that, on a schedule, so a change upstream surfaces
# here rather than in someone's browser.
name: verify-feed

on:
  schedule:
    # Weekly, Monday morning UTC.
    - cron: '0 9 * * 1'
  workflow_dispatch:

# Read-only: this job only fetches public feeds and runs a script. Without
# this it would get whatever default the repository grants the token.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Check the feeds are readable from a browser
        run: |
          fail=0
          for url in \
            "https://svc.metrotransit.org/mtgtfs/gtfs.zip" \
            "https://svc.metrotransit.org/mtgtfs/vehiclepositions.pb" \
            "https://svc.metrotransit.org/mtgtfs/tripupdates.pb" \
            "https://svc.metrotransit.org/mtgtfs/alerts.pb"; do
            headers=$(curl -sS -o /dev/null -D - --max-time 60 -r 0-512 \
              -H 'Origin: https://example.com' "$url" || true)
            # The status matters as much as the header: an error page can carry
            # CORS headers too, and this check once passed a feed that was 404.
            status=$(printf '%s' "$headers" | head -1 | awk '{print $2}')
            if ! printf '%s' "$status" | grep -q '^2'; then
              echo "FAIL $url answered HTTP $status"
              fail=1
            elif printf '%s' "$headers" | grep -qi '^access-control-allow-origin:'; then
              echo "ok   $url"
            else
              echo "FAIL $url is no longer readable from a browser"
              # The static deployment depends on this; it is not a warning.
              fail=1
            fi
          done
          exit $fail

      - name: Check the aircraft feeds still answer
        run: |
          # Planes come from community ADS-B feeds the app relays (they send
          # no CORS headers, so a page cannot read them itself). The relay
          # falls back from one to the next, so one answering is enough.
          feeds=0
          for url in \
            "https://api.adsb.lol/v2/point/44.95/-93.23/36" \
            "https://opendata.adsb.fi/api/v2/lat/44.95/lon/-93.23/dist/36"; do
            count=$(curl -sS --max-time 30 "$url" | jq '(.ac // .aircraft) | length' 2>/dev/null || true)
            if [ -n "$count" ] && [ "$count" != "null" ]; then
              echo "ok   $url ($count aircraft)"
              feeds=1
            else
              echo "FAIL $url"
            fi
          done
          # Routes and aircraft details are looked up straight from the
          # browser, so this one must keep sending CORS headers.
          lookups=0
          if curl -sS -o /dev/null -D - --max-time 30 -H 'Origin: https://example.com' \
              https://api.adsbdb.com/v0/callsign/DAL1 | grep -qi '^access-control-allow-origin:'; then
            echo "ok   adsbdb is readable from a browser"
            lookups=1
          else
            echo "FAIL adsbdb is no longer readable from a browser; plane routes will not load"
          fi
          [ "$feeds" = 1 ] && [ "$lookups" = 1 ]

      - name: Load the real feed and plan a trip
        run: npx tsx server/src/verifyFeed.ts
