# TEMPORARY: screenshots of the round 3 build against real Metro Transit data
# and real map tiles, which the development sandbox cannot reach. Removed
# before the pull request.
name: r3-screenshots

on:
  push:
    branches:
      - claude/minneapolis-metro-transit-app-fogex9
    paths:
      - .github/workflows/r3-screenshots.yml
      - .github/r3-shoot.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shoot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the static client for Metro Transit
        env:
          VITE_BASE: /
          VITE_DATA_MODE: browser
          VITE_AGENCY_ID: metro-transit
        run: npm run build:web
      - name: Install a browser
        run: |
          mkdir -p /tmp/shoot && cd /tmp/shoot && npm init -y >/dev/null && npm i playwright@1.49.1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Serve and shoot
        run: |
          npx --prefix web vite preview --outDir web/dist --host 127.0.0.1 --port 4173 --strictPort &
          sleep 3
          cp .github/r3-shoot.mjs /tmp/shoot/shoot.mjs
          cd /tmp/shoot && node shoot.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r3-screenshots
          path: /tmp/shoot/out
          retention-days: 3
