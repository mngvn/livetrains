# Temporary probe: can a browser talk to Metro Transit's feeds directly?
#
# The answer decides the deployment architecture. If these feeds send
# Access-Control-Allow-Origin, the app can run entirely client-side on GitHub
# Pages with no server at all. If they do not, a small API host is required.
name: probe-feeds

on:
  workflow_dispatch:
  push:
    branches: [claude/minneapolis-metro-transit-app-fogex9]
    paths: ['.github/workflows/probe-feeds.yml']

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe feed endpoints for CORS and size
        run: |
          probe() {
            local label="$1" url="$2"
            echo "────────────────────────────────────────────────────────"
            echo "## $label"
            echo "   $url"
            # Send an Origin header the way a browser on Pages would.
            headers=$(curl -sS -o /dev/null -D - --max-time 45 \
              -H 'Origin: https://mngvn.github.io' \
              -H 'User-Agent: livetrains-probe' \
              -r 0-1024 "$url" 2>&1 || echo "REQUEST FAILED")
            status=$(printf '%s' "$headers" | grep -iE '^HTTP/' | tail -1 | tr -d '\r')
            acao=$(printf '%s' "$headers" | grep -i '^access-control-allow-origin:' | tr -d '\r')
            len=$(printf '%s' "$headers" | grep -iE '^content-range:|^content-length:' | tr -d '\r')
            ctype=$(printf '%s' "$headers" | grep -i '^content-type:' | tr -d '\r')
            echo "   status : ${status:-none}"
            echo "   type   : ${ctype:-none}"
            echo "   size   : ${len:-unknown}"
            if [ -n "$acao" ]; then
              echo "   CORS   : YES -> $acao"
            else
              echo "   CORS   : NO  (no access-control-allow-origin header)"
            fi
          }

          probe "GTFS static archive"      "https://svc.metrotransit.org/mtgtfs/gtfs.zip"
          probe "GTFS-RT vehicle positions" "https://svc.metrotransit.org/mtgtfs/vehiclepositions.pb"
          probe "GTFS-RT trip updates"      "https://svc.metrotransit.org/mtgtfs/tripupdates.pb"
          probe "GTFS-RT alerts"            "https://svc.metrotransit.org/mtgtfs/alerts.pb"
          probe "NexTrip v2 routes (JSON)"  "https://svc.metrotransit.org/nextrip/routes"
          probe "NexTrip v2 stop board"     "https://svc.metrotransit.org/nextrip/56001"
          echo "────────────────────────────────────────────────────────"

      - name: Measure the real GTFS archive
        run: |
          echo "Downloading the full GTFS archive to measure it..."
          curl -sS --max-time 300 -o gtfs.zip "https://svc.metrotransit.org/mtgtfs/gtfs.zip" || exit 0
          echo "compressed: $(du -h gtfs.zip | cut -f1)"
          mkdir -p out && unzip -q -o gtfs.zip -d out || exit 0
          echo "uncompressed contents:"
          ls -lhS out | awk 'NR>1 {printf "   %8s  %s\n", $5, $9}'
          echo "total uncompressed: $(du -sh out | cut -f1)"
          echo "stop_times rows: $(wc -l < out/stop_times.txt 2>/dev/null || echo n/a)"
