# TEMPORARY: the aircraft feature against live data, which the development
# sandbox cannot reach. Removed before the pull request.
name: planes-live

on:
  push:
    branches:
      - claude/zealous-darwin-gjrjew
    paths:
      - .github/workflows/planes-live.yml
      - .github/planes-live.mjs
      - .github/planes-live-relay.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Server relay against the real feed
        run: |
          (npx tsx server/src/index.ts > /tmp/server.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:8080/api/planes && break; sleep 1; done
          curl -sS http://127.0.0.1:8080/api/planes | jq -c '{source, now, count: (.planes | length), airborne: ([.planes[] | select(.onGround | not)] | length), sample: [.planes[:3][] | {id, callsign, altitude, groundSpeed, track, typeName, owner}]}'
          sleep 2
          curl -sS -o /dev/null -w 'second ask %{http_code} in %{time_total}s (cached)\n' http://127.0.0.1:8080/api/planes
      - name: Build the static client as Pages does, with a relay
        env:
          VITE_BASE: /
          VITE_DATA_MODE: browser
          VITE_AGENCY_ID: metro-transit
          VITE_PLANES_URL: http://127.0.0.1:8787/planes/{lat}/{lon}/{radius}
        run: npm run build:web
      - name: Install a browser
        run: |
          mkdir -p /tmp/shoot && cd /tmp/shoot && npm init -y >/dev/null && npm i playwright@1.49.1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Drive it
        run: |
          (node .github/planes-live-relay.mjs > /tmp/relay.log 2>&1 &)
          (npx --prefix web vite preview --outDir web/dist --host 127.0.0.1 --port 4173 --strictPort > /tmp/preview.log 2>&1 &)
          sleep 4
          cp .github/planes-live.mjs /tmp/shoot/live.mjs
          cd /tmp/shoot && node live.mjs
      - name: Relay log
        if: always()
        run: head -20 /tmp/relay.log; echo ...; tail -5 /tmp/relay.log; grep -i plane /tmp/server.log | tail -5 || true
