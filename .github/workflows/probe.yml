# Temporary: gathers facts about the real services this app depends on.
name: probe
on:
  push:
    branches: [claude/minneapolis-metro-transit-app-fogex9]
    paths: [scripts/probe.mjs, .github/workflows/probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: node scripts/probe.mjs
