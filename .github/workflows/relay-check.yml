# TEMPORARY: asks the deployed aircraft relay what the site asks it.
name: relay-check
on:
  push:
    branches: [claude/zealous-darwin-gjrjew]
    paths: [.github/workflows/relay-check.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for i in 1 2 3; do
            curl -sS -m 30 -D /tmp/h -o /tmp/b -H 'Origin: https://mngvn.github.io' \
              "https://noisy-tuna-5407.mngvn.deno.net/planes/44.95/-93.225/37" || echo "curl failed"
            tr -d '\r' < /tmp/h | grep -iE '^(HTTP|access-control|content-type)'
            echo "body: $(head -c 300 /tmp/b)"
            echo "aircraft: $(jq '(.ac // .aircraft) | length' /tmp/b 2>/dev/null)"
            sleep 12
          done
          echo "--- the live page's built-in relay address"
          js=$(curl -sS https://mngvn.github.io/livetrains/ | grep -o 'assets/index-[^"]*\.js' | head -1)
          echo "page script: $js"
          curl -sS "https://mngvn.github.io/livetrains/$js" | grep -o 'noisy-tuna[^"]*' | head -2
