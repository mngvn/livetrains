<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0e14" />
    <meta name="description" content="Live transit map and door-to-door trip planner" />
    <title>livetrains — live transit map</title>
    <script>
      // Apply the theme before first paint, so the loading screen is already
      // the right ground. Dark unless chosen otherwise; "auto" guesses from
      // the clock until the app can work out the sun. Mirrors src/lib/theme.ts.
      try {
        var theme = localStorage.getItem('livetrains.theme');
        var hour = new Date().getHours();
        var resolved = theme === 'light' ? 'light' : theme === 'auto' ? (hour >= 19 || hour < 7 ? 'dark' : 'light') : 'dark';
        document.documentElement.dataset.theme = resolved;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
