<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1220" />
    <meta name="description" content="Live transit map and door-to-door trip planner" />
    <title>livetrains — live transit map</title>
    <script>
      // Apply a saved light/dark choice before first paint, so the loading
      // screen is already the right colour. Mirrors src/lib/theme.ts.
      try {
        var theme = localStorage.getItem('livetrains.theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
